# Topic rotation pool for the daily post.
#
# The generator picks deterministically by date (ordinal % len), skipping topics
# used by the last ~14 posts. Edit freely: add, remove, or reorder — nothing
# depends on the positions staying stable.
#
# Override for a one-off post:  TOPIC="你想写的主题" python3 scripts/generate_post.py

topics:
  - 分布式系统中的一致性模型与共识算法
  - Linux 内核的内存管理与页缓存机制
  - 数据库查询优化器的工作原理
  - 现代 CPU 的缓存层次与伪共享问题
  - 网络协议栈：从 TCP 拥塞控制到 QUIC
  - 编译器优化技术与中间表示
  - 容器与 Kubernetes 的隔离机制
  - 大语言模型的推理优化与 KV Cache
  - Transformer 架构的注意力机制变体
  - 密码学基础：哈希、签名与 TLS 握手
  - 并发编程的内存模型与无锁数据结构
  - 可观测性：指标、日志与分布式追踪
  - 存储引擎：LSM Tree 与 B+ Tree 的权衡
  - 编程语言的类型系统与形式化验证
  - 操作系统调度器的设计演进
  - 前端渲染管线与浏览器性能优化
  - 消息队列的投递语义与幂等设计
  - 计算机图形学的渲染管线基础
  - 信息检索与向量数据库的索引结构
  - 软件架构中的领域驱动设计实践

# Appended to every prompt. Use it to steer style or depth globally.
extra_instructions: >
  优先讲清底层机制和取舍，而不是罗列 API 用法。如果涉及具体数字（延迟、吞吐、容量），
  说明它的来源和适用条件。
